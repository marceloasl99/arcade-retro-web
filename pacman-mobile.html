<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#020617">
<title>PAC-MAN — Arcade Mobile</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:#020617; overflow:hidden;
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
    overscroll-behavior:none;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    color:#e2e8f0;
  }

  #app-mobile {
    width:100%; max-width:440px; height:100dvh; height:100%;
    margin:0 auto; display:flex; flex-direction:column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: radial-gradient(circle at 50% 30%, #0c1527 0%, #020617 100%);
    overflow:hidden; position:fixed; top:0; bottom:0; left:50%; transform:translateX(-50%);
    box-shadow: 0 0 50px rgba(0,0,0,0.95);
  }

  /* ------------------- CABEÇALHO SUPERIOR ------------------- */
  #header-mobile {
    flex:0 0 auto; height:46px; display:flex; align-items:center;
    justify-content:space-between; padding:0 8px; width:100%;
    background:rgba(15,23,42,0.95); border-bottom:1px solid rgba(250,204,21,0.25);
    z-index:20;
  }
  #voltar-link {
    color:#facc15; text-decoration:none; font-size:10px; font-weight:800;
    letter-spacing:0.06em; display:flex; align-items:center; gap:3px;
    flex-shrink:0;
  }
  .info-bar { display:flex; gap:8px; font-size:10px; align-items:center; }
  .info-item { display:flex; flex-direction:column; align-items:center; }
  .info-rotulo { font-size:7px; color:#94a3b8; letter-spacing:0.05em; text-transform:uppercase; }
  .info-val { font-weight:900; color:#facc15; font-size:11px; }

  .acoes-topo { display:flex; gap:5px; flex-shrink:0; }
  .btn-topo {
    background:#1e293b; border:1px solid #475569; border-radius:6px;
    color:#94a3b8; padding:4px 6px; font-size:11px; font-weight:700;
    font-family:inherit; cursor:pointer; min-width:32px; height:30px;
    display:flex; align-items:center; justify-content:center;
  }
  .btn-topo:active { background:#facc15; color:#020617; }

  /* ------------------- PALCO CENTRAL DO JOGO ------------------- */
  #palco {
    flex:1 1 auto; min-width:0; min-height:0; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center; padding:4px;
  }
  #arena-frame-mobile {
    position:relative; display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 24px rgba(0,0,0,0.85), 0 0 0 1px rgba(250,204,21,0.3);
    border-radius:8px; overflow:hidden; background:#000;
  }
  #tela {
    display:block; width:100%; height:100%;
    image-rendering:pixelated; image-rendering:crisp-edges;
  }

  /* ------------------- PAINEL DE CONTROLES TOUCH ------------------- */
  #controles-deck {
    flex:0 0 auto; padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);
    display:flex; align-items:center; justify-content:center;
    background:rgba(15,23,42,0.96); border-top:1px solid rgba(250,204,21,0.25);
    z-index:20;
  }

  /* D-PAD ERGONÔMICO 4 VIAS */
  .dpad-container {
    width:150px; height:150px; position:relative; flex-shrink:0;
  }
  .dpad-btn {
    position:absolute; width:48px; height:48px; background:linear-gradient(180deg, #1e293b, #0f172a);
    border:2px solid rgba(250,204,21,0.35); border-radius:10px; color:#facc15;
    font-size:22px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 #05070f; cursor:pointer; touch-action:none;
    transition:transform 0.05s, background 0.05s;
  }
  .dpad-btn.pressed, .dpad-btn:active {
    background:#eab308; color:#020617; transform:translateY(2px);
    box-shadow:0 1px 0 #05070f; border-color:#fef08a;
  }
  #btn-up    { top:0; left:51px; }
  #btn-down  { bottom:0; left:51px; }
  #btn-left  { top:51px; left:0; }
  #btn-right { top:51px; right:0; }

  /* BOTÃO PLAY / RESET CENTRAL */
  .dpad-center {
    position:absolute; top:51px; left:51px; width:48px; height:48px;
    border-radius:10px; background:#020617; border:2px dashed rgba(250,204,21,0.4);
    display:flex; align-items:center; justify-content:center; font-size:16px;
    cursor:pointer;
  }
  .dpad-center:active { background:#eab308; }
</style>
</head>
<body>

<div id="app-mobile">
  <!-- CABEÇALHO SUPERIOR -->
  <header id="header-mobile">
    <a href="index.html" id="voltar-link">
      <span>&larr;</span>
      <span data-en="MENU" data-pt="MENU">MENU</span>
    </a>

    <div class="info-bar">
      <div class="info-item">
        <span class="info-rotulo" data-en="SCORE" data-pt="PTS">SCORE</span>
        <span class="info-val" id="hud-score">000000</span>
      </div>
      <div class="info-item">
        <span class="info-rotulo" data-en="LEVEL" data-pt="FASE">LEVEL</span>
        <span class="info-val" id="hud-level" style="color:#38bdf8;">1</span>
      </div>
      <div class="info-item">
        <span class="info-rotulo" data-en="LIVES" data-pt="VIDAS">LIVES</span>
        <span class="info-val" id="hud-lives">3</span>
      </div>
      <div class="info-item">
        <span class="info-rotulo" data-en="DOTS" data-pt="REST">DOTS</span>
        <span class="info-val" id="hud-dots" style="color:#4ade80;">244</span>
      </div>
    </div>

    <div class="acoes-topo">
      <button type="button" class="btn-topo" id="btn-som" title="Som">🔊</button>
      <button type="button" class="btn-topo btn-lang-toggle" onclick="alternarIdioma()" title="Language">🇺🇸</button>
      <button type="button" class="btn-topo" id="btn-pausa" title="Pausa">⏸</button>
    </div>
  </header>

  <!-- PALCO DO JOGO -->
  <main id="palco">
    <div id="arena-frame-mobile">
      <canvas id="tela" width="560" height="720"></canvas>
    </div>
  </main>

  <!-- DECK TOUCH COM D-PAD -->
  <footer id="controles-deck">
    <div class="dpad-container">
      <button type="button" class="dpad-btn" id="btn-up">&uarr;</button>
      <button type="button" class="dpad-btn" id="btn-down">&darr;</button>
      <button type="button" class="dpad-btn" id="btn-left">&larr;</button>
      <button type="button" class="dpad-btn" id="btn-right">&rarr;</button>
      <div class="dpad-center" id="btn-center">🟡</div>
    </div>
  </footer>
</div>

<script src="roteador.js"></script>
<script src="pacman.js"></script>
<script>
"use strict";
(function () {
  const canvas = document.getElementById("tela");
  const palco = document.getElementById("palco");
  const arenaFrame = document.getElementById("arena-frame-mobile");

  const hudScore = document.getElementById("hud-score");
  const hudLevel = document.getElementById("hud-level");
  const hudLives = document.getElementById("hud-lives");
  const hudDots = document.getElementById("hud-dots");

  const btnPausa = document.getElementById("btn-pausa");
  const btnSom = document.getElementById("btn-som");
  const btnCenter = document.getElementById("btn-center");

  function redimensionarArenaMobile() {
    if (!palco || !arenaFrame) return;
    const wMax = palco.clientWidth - 8;
    const hMax = palco.clientHeight - 8;
    const proporcao = 560 / 720;

    let w = wMax;
    let h = w / proporcao;

    if (h > hMax) {
      h = hMax;
      w = h * proporcao;
    }

    arenaFrame.style.width = Math.floor(w) + "px";
    arenaFrame.style.height = Math.floor(h) + "px";
  }

  window.addEventListener("resize", redimensionarArenaMobile);
  window.addEventListener("orientationchange", redimensionarArenaMobile);
  setTimeout(redimensionarArenaMobile, 40);
  setTimeout(redimensionarArenaMobile, 200);

  const game = new Pacman.PacmanGame(canvas, {
    onHudUpdate: function (info) {
      if (hudScore) hudScore.textContent = String(info.score).padStart(6, "0");
      if (hudLevel) hudLevel.textContent = String(info.level);
      if (hudLives) hudLives.textContent = String(info.lives);
      if (hudDots) hudDots.textContent = String(info.dotsRemaining);

      if (btnPausa) btnPausa.textContent = info.state === "paused" ? "▶" : "⏸";
      if (btnSom) btnSom.textContent = info.sound ? "🔊" : "🔇";
    }
  });

  function ligarBotao(id, dir) {
    const el = document.getElementById(id);
    if (!el) return;
    const disparar = (e) => {
      e.preventDefault();
      el.classList.add("pressed");
      game.setNextDirection(dir);
    };
    const soltar = (e) => {
      e.preventDefault();
      el.classList.remove("pressed");
    };
    el.addEventListener("pointerdown", disparar);
    el.addEventListener("pointerup", soltar);
    el.addEventListener("pointercancel", soltar);
    el.addEventListener("pointerleave", soltar);
  }

  ligarBotao("btn-up", Pacman.DIR_UP);
  ligarBotao("btn-down", Pacman.DIR_DOWN);
  ligarBotao("btn-left", Pacman.DIR_LEFT);
  ligarBotao("btn-right", Pacman.DIR_RIGHT);

  btnCenter.addEventListener("click", () => {
    if (game.state === "start" || game.state === "gameover") {
      game.startNewGame();
    }
  });

  btnPausa.addEventListener("click", () => game.togglePause());
  btnSom.addEventListener("click", () => game.toggleSound());

  canvas.addEventListener("click", () => {
    if (game.state === "start" || game.state === "gameover") {
      game.startNewGame();
    }
  });

  // Suporte a Swipe Gesture no Canvas
  let touchStartX = 0;
  let touchStartY = 0;

  canvas.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });

  canvas.addEventListener("touchend", (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.hypot(dx, dy) < 25) return;

    if (Math.abs(dx) > Math.abs(dy)) {
      game.setNextDirection(dx > 0 ? Pacman.DIR_RIGHT : Pacman.DIR_LEFT);
    } else {
      game.setNextDirection(dy > 0 ? Pacman.DIR_DOWN : Pacman.DIR_UP);
    }
  }, { passive: true });

  game.startLoop();
})();
</script>
</body>
</html>

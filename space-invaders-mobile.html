<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#05070f">
<title>SPACE INVADERS — Celular</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:#05070f; overflow:hidden;
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
    overscroll-behavior:none;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    color:#e2e8f0;
  }

  #app-mobile {
    width:100%; max-width:430px; height:100dvh; height:100%;
    margin:0 auto; display:flex; flex-direction:column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: radial-gradient(circle at 50% 30%, #0c1222 0%, #05070f 100%);
    overflow:hidden; position:fixed; top:0; bottom:0; left:50%; transform:translateX(-50%);
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
  }

  /* ------------------- CABEÇALHO SUPERIOR ------------------- */
  #header-mobile {
    flex:0 0 auto; height:44px; display:flex; align-items:center;
    justify-content:space-between; padding:0 8px; width:100%;
    background:rgba(8,12,22,0.94); border-bottom:1px solid rgba(56,189,248,0.2);
    z-index:20;
  }
  #voltar-link {
    color:#38bdf8; text-decoration:none; font-size:10px; font-weight:800;
    letter-spacing:0.06em; display:flex; align-items:center; gap:3px;
    flex-shrink:0;
  }
  .info-bar { display:flex; gap:8px; font-size:10px; align-items:center; }
  .info-item { display:flex; flex-direction:column; align-items:center; }
  .info-rotulo { font-size:7px; color:#64748b; letter-spacing:0.05em; text-transform:uppercase; }
  .info-val { font-weight:800; color:#f8fafc; font-size:11px; }

  .acoes-topo { display:flex; gap:5px; flex-shrink:0; }
  .btn-topo {
    background:#1e293b; border:1px solid #475569; border-radius:6px;
    color:#94a3b8; padding:4px 6px; font-size:11px; font-weight:700;
    font-family:inherit; cursor:pointer; min-width:30px; height:28px;
    display:flex; align-items:center; justify-content:center;
  }
  .btn-topo:active { background:#38bdf8; color:#0f172a; }

  /* ------------------- PALCO CENTRAL DO JOGO ------------------- */
  #palco {
    flex:1 1 auto; min-width:0; min-height:0; position:relative; overflow:hidden;
  }
  #tela {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    display:block;
    box-shadow: 0 0 24px rgba(0,0,0,0.85), 0 0 0 1px rgba(56,189,248,0.25);
    border-radius:6px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }

  /* ------------------- PAINEL DE CONTROLES DE TOQUE ------------------- */
  #controles-deck {
    flex:0 0 auto; padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:rgba(8,12,22,0.96); border-top:1px solid rgba(56,189,248,0.2);
    z-index:20;
  }

  .grupo-direcional {
    display:flex; gap:8px; flex:1 1 50%;
  }

  .btn-toque {
    touch-action:none; user-select:none; -webkit-user-select:none;
    display:flex; align-items:center; justify-content:center;
    border-radius:12px; font-family:inherit; font-weight:800;
    cursor:pointer; outline:none; transition:transform 0.05s, background-color 0.05s;
    border:2px solid rgba(56,189,248,0.35);
    background:linear-gradient(180deg, #1e293b, #0f172a);
    color:#38bdf8;
    box-shadow:0 4px 0 #05070f, inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .btn-toque:active, .btn-toque.pressed {
    transform:translateY(3px);
    box-shadow:0 1px 0 #05070f;
    background:#2563eb;
    color:#ffffff;
    border-color:#60a5fa;
  }

  .btn-mov {
    flex:1; height:64px; font-size:26px;
  }

  .btn-fogo {
    flex:1 1 50%; height:64px; font-size:15px; letter-spacing:0.08em;
    background:linear-gradient(180deg, #be123c, #881337);
    border-color:#fb7185; color:#fff1f2;
    box-shadow:0 4px 0 #4c0519, inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .btn-fogo:active, .btn-fogo.pressed {
    background:#f43f5e; color:#ffffff;
    box-shadow:0 1px 0 #4c0519;
    border-color:#fda4af;
  }
</style>
</head>
<body>

<div id="app-mobile">
  <!-- TOPO -->
  <header id="header-mobile">
    <a id="voltar-link" href="index.html">&larr; JOGOS</a>

    <div class="info-bar">
      <div class="info-item">
        <span class="info-rotulo">Pontos</span>
        <span id="txt-pontos" class="info-val">000000</span>
      </div>
      <div class="info-item">
        <span class="info-rotulo">Recorde</span>
        <span id="txt-recorde" class="info-val" style="color:#facc15;">000000</span>
      </div>
      <div class="info-item">
        <span class="info-rotulo">Vidas</span>
        <span id="txt-vidas" class="info-val" style="color:#55ff55;">3</span>
      </div>
    </div>

    <div class="acoes-topo">
      <button id="btn-som" class="btn-topo" type="button">🔊</button>
      <button id="btn-pausa" class="btn-topo" type="button">⏸</button>
    </div>
  </header>

  <!-- ARENA DE JOGO -->
  <main id="palco">
    <canvas id="tela" width="480" height="640"></canvas>
  </main>

  <!-- CONTROLES DE TOQUE -->
  <footer id="controles-deck">
    <div class="grupo-direcional">
      <button id="btn-esq" class="btn-toque btn-mov" type="button" aria-label="Esquerda">◀</button>
      <button id="btn-dir" class="btn-toque btn-mov" type="button" aria-label="Direita">▶</button>
    </div>
    <button id="btn-fogo" class="btn-toque btn-fogo" type="button" aria-label="Disparar Laser">
      FIRE ⚡
    </button>
  </footer>
</div>

<script src="roteador.js"></script>
<script src="space-invaders.js"></script>
<script>
"use strict";
(function () {
  if (window.__redirecionando) return;

  var canvas = document.getElementById('tela');
  if (typeof window.criarSpaceInvaders !== 'function') {
    alert('Erro: arquivo space-invaders.js não encontrado.');
    return;
  }

  var txtPontos = document.getElementById('txt-pontos');
  var txtRecorde = document.getElementById('txt-recorde');
  var txtVidas = document.getElementById('txt-vidas');
  var btnSom = document.getElementById('btn-som');
  var btnPausa = document.getElementById('btn-pausa');

  var jogo = window.criarSpaceInvaders(canvas, {
    aoAtualizar: function (d) {
      if (txtPontos) txtPontos.textContent = String(d.pontos || 0).padStart(6, '0');
      if (txtRecorde) txtRecorde.textContent = String(d.recorde || 0).padStart(6, '0');
      if (txtVidas) txtVidas.textContent = Math.max(0, d.vidas !== undefined ? d.vidas : 3);
      if (btnPausa) btnPausa.textContent = d.pausado ? '▶' : '⏸';
      if (btnSom) btnSom.textContent = d.som ? '🔊' : '🔇';
    }
  });

  jogo.iniciar();

  var palco = document.getElementById('palco');
  function ajustar() {
    var rect = palco.getBoundingClientRect();
    var dispL = Math.max(100, Math.min(rect.width || 9999, window.innerWidth || 9999) - 16);
    var dispA = Math.max(100, (rect.height || (window.innerHeight - 130)) - 12);
    var s = Math.min(dispL / 480, dispA / 640);
    if (!(s > 0)) s = 0.5;
    canvas.style.width = Math.floor(480 * s) + 'px';
    canvas.style.height = Math.floor(640 * s) + 'px';
  }
  window.addEventListener('resize', ajustar);
  window.addEventListener('orientationchange', function () { setTimeout(ajustar, 200); });
  ajustar();

  /* ------------------- TOQUE NOS BOTÕES COM POINTER EVENTS ------------------- */
  function ligarBotao(id, aoPressionar, aoSoltar) {
    var el = document.getElementById(id);
    if (!el) return;

    var pressionado = false;
    function iniciar(e) {
      if (e) e.preventDefault();
      pressionado = true;
      el.classList.add('pressed');
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      aoPressionar();
    }
    function parar(e) {
      if (e) e.preventDefault();
      if (pressionado) {
        pressionado = false;
        el.classList.remove('pressed');
        aoSoltar();
      }
    }

    el.addEventListener('pointerdown', iniciar, { passive: false });
    el.addEventListener('pointerup', parar, { passive: false });
    el.addEventListener('pointercancel', parar, { passive: false });
    el.addEventListener('lostpointercapture', parar, { passive: false });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  ligarBotao('btn-esq',
    function () { jogo.entrada.esquerda(true); },
    function () { jogo.entrada.esquerda(false); }
  );

  ligarBotao('btn-dir',
    function () { jogo.entrada.direita(true); },
    function () { jogo.entrada.direita(false); }
  );

  ligarBotao('btn-fogo',
    function () { jogo.entrada.disparar(true); },
    function () { jogo.entrada.disparar(false); }
  );

  btnPausa.addEventListener('click', function () {
    jogo.acao('pausa');
  });

  btnSom.addEventListener('click', function () {
    jogo.acao('som');
  });

  /* Toque na tela para iniciar quando em tela de título */
  canvas.addEventListener('pointerdown', function () {
    var d = jogo.dados();
    if (d.estado === 'title' || d.estado === 'gameover') {
      jogo.acao('comecar');
    }
  });

  /* Arraste com o dedo na arena para guiar o canhão */
  var tocandoCanvas = false;
  var ultimoX = 0;
  canvas.addEventListener('pointerdown', function (e) {
    tocandoCanvas = true;
    ultimoX = e.clientX;
  });
  window.addEventListener('pointermove', function (e) {
    if (!tocandoCanvas) return;
    var rect = canvas.getBoundingClientRect();
    var escala = 480 / rect.width;
    var deltaX = (e.clientX - ultimoX) * escala;
    ultimoX = e.clientX;
    jogo.entrada.mover(deltaX);
  });
  window.addEventListener('pointerup', function () { tocandoCanvas = false; });
  window.addEventListener('pointercancel', function () { tocandoCanvas = false; });
})();
</script>
</body>
</html>

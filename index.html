<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080c08">
<title>RETRO ARCADE — Select a Game / Escolha o Jogo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --verde: #55ff55;
    --verde2: #9bbc0f;
    --verde3: #00aa00;
    --escuro: #0a1107;
    --card-bg: rgba(10, 17, 7, 0.92);
    --borda: #1f2a14;
    --borda-brilho: rgba(85,255,85,0.22);
  }

  html, body {
    width:100%; min-height:100%;
    background:#080c08;
    color:#cfe6a0;
    font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    -webkit-text-size-adjust:100%;
  }

  body {
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:8px 16px 10px; gap:8px;
    background:
      radial-gradient(1400px 700px at 50% -10%, rgba(85,255,85,.08), transparent 75%),
      #080c08;
  }

  /* ---------------- HEADER ---------------- */
  header {
    text-align:center; width:100%; max-width:1280px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }

  .topo-barra {
    width:100%; display:flex; align-items:center; justify-content:space-between;
    margin-bottom:1px;
  }

  /* Seletor de Idioma */
  .lang-switcher {
    display:inline-flex; align-items:center; background:#0e1709;
    border:1px solid var(--borda); border-radius:20px; padding:2px;
    box-shadow:0 0 10px rgba(0,0,0,0.5);
  }
  .btn-lang {
    background:transparent; border:none; color:#7f9a5a;
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.06em;
    padding:3px 8px; border-radius:14px; cursor:pointer; transition:all 0.15s;
  }
  .btn-lang:hover { color:#cfe6a0; }
  .btn-lang.ativo {
    background:var(--verde); color:#04140a;
    box-shadow:0 0 12px rgba(85,255,85,0.4);
  }

  h1 {
    font-size:clamp(18px, 2.2vw, 24px);
    letter-spacing:.12em;
    color:var(--verde);
    text-shadow:0 0 12px rgba(85,255,85,.35);
    font-weight:900;
  }
  header .sub {
    font-size:10.5px;
    color:#7f9a5a; letter-spacing:.04em;
  }
  #aparelho {
    font-size:10px; color:#a9c97a; line-height:1.4;
    margin-top:1px;
  }
  #aparelho a { color:var(--verde2); }
  #aparelho b { color:var(--verde); }

  /* ---------------- GRID DOS 9 JOGOS (3x3 SEM ROLAGEM NO FULL HD) ---------------- */
  #lista {
    width:100%; max-width:1280px;
    display:grid; grid-template-columns:repeat(3, 1fr);
    gap:8px;
  }

  .card {
    background:var(--card-bg);
    border:1px solid var(--borda);
    border-radius:10px;
    padding:8px 10px;
    display:flex; flex-direction:column; justify-content:space-between; gap:6px;
    transition:border-color .15s, transform .15s, box-shadow .15s;
    box-shadow:0 3px 12px rgba(0,0,0,.6);
  }
  .card:hover {
    border-color:var(--verde3);
    transform:translateY(-1px);
    box-shadow:0 6px 18px rgba(0,0,0,.7), 0 0 0 1px rgba(85,255,85,.15) inset;
  }

  /* Cabeçalho do Card (Ícone Canvas + Título + Console) */
  .card-topo {
    display:flex; align-items:center; gap:8px;
  }
  .icone {
    flex:0 0 auto; display:block;
    width:52px; height:26px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#0a0f07;
    border:1px solid var(--borda);
    border-radius:5px;
  }
  .card-meta {
    flex:1 1 auto; min-width:0;
  }
  .card-meta h2 {
    font-size:13px; letter-spacing:.06em;
    color:var(--verde); font-weight:800; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .console {
    display:inline-block; margin-top:1px;
    font-size:8.5px; letter-spacing:.08em;
    padding:1px 5px; border-radius:10px;
    border:1px solid var(--borda); color:var(--verde2);
    background:#0a1006; font-weight:700;
  }

  /* Descrição e Controles do Card */
  .card-corpo {
    flex:1 1 auto; display:flex; flex-direction:column; gap:4px;
  }
  .card-corpo p {
    font-size:10px; line-height:1.35; color:#9db874;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; height:26px;
  }
  .teclas {
    color:#6f8a4c !important; font-size:9px !important;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    display:block !important; height:auto !important;
  }

  /* Ações do Card */
  .card-acoes {
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    gap:6px; padding-top:4px; border-top:1px solid rgba(255,255,255,0.04);
  }
  .jogar {
    display:inline-flex; align-items:center; justify-content:center;
    text-decoration:none; text-align:center;
    padding:5px 12px; border-radius:6px;
    background:var(--verde); color:#04140a;
    font-weight:900; letter-spacing:.08em;
    font-size:11px; border:2px solid var(--verde);
    transition:transform .1s, box-shadow .15s;
    white-space:nowrap;
  }
  .jogar:hover { transform:scale(1.03); box-shadow:0 0 12px rgba(85,255,85,.4); }
  .outra {
    font-size:9.5px; color:#6f8a4c; text-align:right;
  }
  .outra a { color:var(--verde2); text-decoration:underline; }

  /* ---------------- FOOTER ---------------- */
  footer {
    width:100%; max-width:1280px; text-align:center;
    font-size:9.5px; color:#5f7742; line-height:1.4;
    margin-top:1px;
  }
  footer code { color:var(--verde2); }

  /* ---------------- RESPONSIVIDADE ---------------- */
  @media (max-width: 1100px) {
    #lista { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 680px) {
    #lista { grid-template-columns: 1fr; }
    .card-acoes { flex-direction:column; align-items:stretch; }
    .jogar { width:100%; }
    .outra { text-align:center; }
  }
</style>
</head>

  /* --------------------------- icones desenhados --------------------------- */
  function pintarIcone(cv, id) {
    var c = cv.getContext('2d');
    var p = cv.width / 12; // escala proporcional para o canvas de 70x35
    c.clearRect(0, 0, cv.width, cv.height);
    function bloco(x, y, cor) { c.fillStyle = cor; c.fillRect(x * p, y * p, p, p); }

    if (id === 'minhoquinha') {
      var corpo = [[1,3],[2,3],[3,3],[4,3],[5,3],[5,2],[6,2]];
      for (var i = 0; i < corpo.length; i++) bloco(corpo[i][0], corpo[i][1], i < 4 ? '#00aa00' : '#55ff55');
      bloco(7, 2, '#55ff55');
      c.fillStyle = '#000';
      c.fillRect(7 * p + 3, 2 * p + 1, 2, 2);
      bloco(10, 4, '#ff5555');
      return;
    }

    if (id === 'tetris') {
      var cor = '#9bbc0f';
      [[2,1],[1,2],[2,2],[3,2]].forEach(function (b) { bloco(b[0], b[1], cor); });
      [[5,2],[6,2],[6,3],[7,3]].forEach(function (b) { bloco(b[0], b[1], cor); });
      [[9,1],[9,2],[9,3],[9,4]].forEach(function (b) { bloco(b[0], b[1], cor); });
      c.fillStyle = '#0f380f';
      c.fillRect(0, 5 * p, cv.width, 2);
      return;
    }

    if (id === 'pinball') {
      [[3,1],[4,1],[3,2],[4,2]].forEach(function (b) { bloco(b[0], b[1], '#00e5ff'); });
      [[7,1],[8,1],[7,2],[8,2]].forEach(function (b) { bloco(b[0], b[1], '#ff007f'); });
      [[5,2],[6,2],[5,3],[6,3]].forEach(function (b) { bloco(b[0], b[1], '#ffd700'); });
      bloco(5, 0, '#ffffff');
      [[2,5],[3,5],[4,4]].forEach(function (b) { bloco(b[0], b[1], '#55aaff'); });
      [[9,5],[8,5],[7,4]].forEach(function (b) { bloco(b[0], b[1], '#55aaff'); });
      bloco(11, 1, '#ff3366'); bloco(11, 2, '#ff3366'); bloco(11, 3, '#ff3366');
      bloco(11, 4, '#ffffff');
      return;
    }

    if (id === 'space-invaders') {
      var alien = [
        [4,0],[7,0],[5,1],[6,1],[4,2],[5,2],[6,2],[7,2],
        [3,3],[4,3],[5,3],[6,3],[7,3],[8,3],
        [3,4],[5,4],[6,4],[8,4],[2,3],[9,3],[2,2],[9,2]
      ];
      for (var ai = 0; ai < alien.length; ai++) bloco(alien[ai][0], alien[ai][1], '#55ff55');
      c.fillStyle = '#0a0f07';
      c.fillRect(4 * p + 2, 3 * p + 1, 2, 3);
      c.fillRect(7 * p + 2, 3 * p + 1, 2, 3);
      [[5,5],[6,5],[4,5],[7,5]].forEach(function (b) { bloco(b[0], b[1], '#38bdf8'); });
      bloco(5, 2, '#ffd700'); bloco(10, 0, '#ef4444');
      return;
    }

    if (id === 'space-cadet') {
      c.fillStyle = '#080c1e';
      c.fillRect(0, 0, cv.width, cv.height);
      [[6,0],[5,1],[6,1],[7,1],[4,2],[5,2],[7,2],[8,2],[4,3],[8,3]].forEach(function (b) {
        bloco(b[0], b[1], '#ffd700');
      });
      bloco(6, 1, '#fff5a0');
      [[3,1],[2,2],[2,3],[3,4],[9,1],[10,2],[10,3],[9,4]].forEach(function (b) {
        bloco(b[0], b[1], '#38bdf8');
      });
      bloco(11, 1, '#f59e0b'); bloco(11, 2, '#f59e0b');
      bloco(6, 4, '#ffffff');
      [[2,5],[3,5]].forEach(function (b) { bloco(b[0], b[1], '#0ea5e9'); });
      [[8,5],[9,5]].forEach(function (b) { bloco(b[0], b[1], '#0ea5e9'); });
      return;
    }

    if (id === 'bomberman') {
      c.fillStyle = '#2f7426';
      c.fillRect(0, 0, cv.width, cv.height);
      for (var gy = 0; gy < 6; gy++) {
        for (var gx = 0; gx < 12; gx++) {
          if ((gx + gy) % 2 === 0) bloco(gx, gy, '#38882e');
        }
      }
      bloco(0, 1, '#475569'); bloco(0, 2, '#334155');
      bloco(11, 4, '#9a3412'); bloco(11, 5, '#7c2d12');
      bloco(5, 0, '#ec4899');
      [[4,1],[6,1],[3,2],[4,2],[5,2],[6,2],[7,2]].forEach(function (b) { bloco(b[0], b[1], '#ffffff'); });
      bloco(4, 2, '#0284c7'); bloco(6, 2, '#0284c7');
      [[4,3],[5,3],[6,3]].forEach(function (b) { bloco(b[0], b[1], '#2563eb'); });
      [[4,4],[5,4],[6,4]].forEach(function (b) { bloco(b[0], b[1], '#ec4899'); });
      bloco(5, 4, '#facc15');
      [[8,3],[9,3],[10,3],[8,4],[9,4],[10,4]].forEach(function (b) { bloco(b[0], b[1], '#111827'); });
      bloco(9, 1, '#facc15'); bloco(9, 2, '#ea580c');
      bloco(9, 3, '#ffffff');
      return;
    }

    if (id === 'defender') {
      c.fillStyle = '#050714';
      c.fillRect(0, 0, cv.width, cv.height);
      // Terreno
      [[0,5],[1,5],[2,4],[3,4],[4,5],[5,5],[6,4],[7,4],[8,5],[9,5],[10,4],[11,5]].forEach(function (b) { bloco(b[0], b[1], '#ef4444'); });
      // Scanner radar topo
      for (var rx = 1; rx < 11; rx++) bloco(rx, 0, '#1e293b');
      bloco(5, 0, '#38bdf8'); bloco(8, 0, '#ef4444');
      // Nave espacial jogador
      [[2,2],[3,2],[4,2],[3,1],[4,1],[5,2]].forEach(function (b) { bloco(b[0], b[1], '#ffffff'); });
      bloco(1, 2, '#38bdf8'); bloco(6, 2, '#facc15');
      // Laser veloz
      bloco(7, 2, '#ef4444'); bloco(8, 2, '#facc15'); bloco(9, 2, '#ef4444');
      // Lander alien
      [[10,1],[11,1],[10,2],[11,2]].forEach(function (b) { bloco(b[0], b[1], '#22c55e'); });
      return;
    }

    if (id === 'pacman') {
      c.fillStyle = '#050811';
      c.fillRect(0, 0, cv.width, cv.height);
      // Paredes azuis labirinto
      for (var px = 0; px < 12; px++) { bloco(px, 0, '#1e3a8a'); bloco(px, 5, '#1e3a8a'); }
      bloco(0, 1, '#1e3a8a'); bloco(0, 4, '#1e3a8a');
      bloco(11, 1, '#1e3a8a'); bloco(11, 4, '#1e3a8a');
      // Pacman amarelo com boca aberta
      [[2,2],[3,2],[4,2],[2,3],[3,3],[4,3]].forEach(function (b) { bloco(b[0], b[1], '#facc15'); });
      bloco(4, 2, '#050811'); // boca
      // Pontos / Energizer
      bloco(6, 2, '#fef08a'); bloco(7, 2, '#fef08a'); bloco(8, 2, '#facc15');
      // Fantasma Blinky vermelho
      [[9,2],[10,2],[9,3],[10,3]].forEach(function (b) { bloco(b[0], b[1], '#ef4444'); });
      bloco(9, 2, '#ffffff'); bloco(10, 2, '#ffffff');
      return;
    }

    if (id === 'penalty-kick') {
      c.fillStyle = '#0f172a';
      c.fillRect(0, 0, cv.width, cv.height * 0.45);
      c.fillStyle = '#16a34a';
      c.fillRect(0, cv.height * 0.45, cv.width, cv.height * 0.55);
      // Trave branca
      for (var gx = 2; gx <= 9; gx++) bloco(gx, 1, '#ffffff');
      bloco(2, 2, '#ffffff'); bloco(2, 3, '#ffffff');
      bloco(9, 2, '#ffffff'); bloco(9, 3, '#ffffff');
      // Rede
      for (var ny = 2; ny <= 3; ny++) {
        for (var nx = 3; nx <= 8; nx++) if ((nx + ny) % 2 === 0) bloco(nx, ny, 'rgba(255,255,255,0.25)');
      }
      // Goleiro laranja
      [[5,2],[6,2],[5,3],[6,3]].forEach(function (b) { bloco(b[0], b[1], '#f97316'); });
      bloco(4, 2, '#22c55e'); bloco(7, 2, '#22c55e'); // luvas
      // Bola de futebol
      bloco(6, 4, '#ffffff'); bloco(5, 5, '#ffffff'); bloco(6, 5, '#020617'); bloco(7, 5, '#ffffff');
      return;
    }

    for (var y = 0; y < 6; y++) for (var x = 0; x < 12; x++) if ((x + y) % 3 === 0) bloco(x, y, '#26301a');
  }

  /* ------------------------------- MONTAGEM & IDIOMA -------------------------------- */
  var ehMobile = (typeof window.detectarMobile === 'function') ? window.detectarMobile() : false;
  var idiomaAtual = (typeof window.obterIdioma === 'function') ? window.obterIdioma() : 'en';

  var btnEn = document.getElementById('btn-en');
  var btnPt = document.getElementById('btn-pt');
  var txtTitulo = document.getElementById('txt-titulo');
  var txtSub = document.getElementById('txt-sub');
  var txtFooter = document.getElementById('txt-footer');
  var aparelhoEl = document.getElementById('aparelho');
  var lista = document.getElementById('lista');

  function renderizarMenu(lang) {
    idiomaAtual = lang;
    document.documentElement.lang = (lang === 'en' ? 'en' : 'pt-BR');

    btnEn.classList.toggle('ativo', lang === 'en');
    btnPt.classList.toggle('ativo', lang === 'pt');

    if (lang === 'en') {
      txtTitulo.textContent = 'RETRO ARCADE';
      txtSub.textContent = '9 classic arcade games recreated in pixels · desktop & mobile editions';
      txtFooter.innerHTML =
        'Each game features two tailored editions: <b>Desktop</b> (keyboard) and <b>Mobile</b> (touch controls).<br>' +
        'To force a version, append <code>?desktop=1</code> or <code>?mobile=1</code> to the URL.';
    } else {
      txtTitulo.textContent = 'ARCADE RETRÔ';
      txtSub.textContent = '9 jogos clássicos recriados em pixels · versão de computador e celular';
      txtFooter.innerHTML =
        'Cada jogo tem duas versões: <b>computador</b> (teclado) e <b>celular</b> (botões na tela).<br>' +
        'Para forçar uma delas, use <code>index.html?desktop=1</code> ou <code>index.html?mobile=1</code>.';
    }

    var forcado = '';
    if (typeof window.forcaDesktop === 'function' && window.forcaDesktop()) forcado = '?desktop=1';
    else if (typeof window.forcaMobile === 'function' && window.forcaMobile()) forcado = '?mobile=1';

    // Dispositivo
    var troca = ehMobile ? '?desktop=1' : '?mobile=1';
    if (lang === 'en') {
      aparelhoEl.innerHTML =
        (ehMobile
          ? 'You are on <b>mobile / tablet</b> &mdash; PLAY buttons launch touch-screen editions.'
          : 'You are on <b>desktop PC</b> &mdash; PLAY buttons launch keyboard cabinet editions.') +
        ' <a href="index.html' + troca + '">switch to ' + (ehMobile ? 'desktop' : 'mobile') + '</a>';
    } else {
      aparelhoEl.innerHTML =
        (ehMobile
          ? 'Você está no <b>celular ou tablet</b> &mdash; os botões JOGAR abrem com controles na tela.'
          : 'Você está no <b>computador</b> &mdash; os botões JOGAR abrem as versões com teclado.') +
        ' <a href="index.html' + troca + '">ver para ' + (ehMobile ? 'computador' : 'celular') + '</a>';
    }

    // Grid dos 6 Jogos
    lista.innerHTML = '';
    JOGOS.forEach(function (j) {
      var recomendado = ehMobile ? j.mobile : j.desktop;
      var outro = ehMobile ? j.desktop : j.mobile;
      var outroForcado = (ehMobile ? '?desktop=1' : '?mobile=1');

      var titulo = (lang === 'en' ? j.tituloEn : j.tituloPt);
      var consoleTxt = (lang === 'en' ? j.consoleEn : j.consolePt);
      var desc = (lang === 'en' ? j.descEn : j.descPt);
      var teclas = ehMobile ? (lang === 'en' ? j.teclasCelEn : j.teclasCelPt)
                            : (lang === 'en' ? j.teclasPcEn : j.teclasPcPt);

      var btnTexto = (lang === 'en' ? 'PLAY' : 'JOGAR');
      var outraTexto = (lang === 'en'
        ? 'or <a href="' + outro + outroForcado + '">' + (ehMobile ? 'desktop version' : 'mobile version') + '</a>'
        : 'ou a <a href="' + outro + outroForcado + '">' + (ehMobile ? 'versão PC' : 'versão celular') + '</a>');

      var card = document.createElement('article');
      card.className = 'card';
      card.innerHTML =
        '<div class="card-topo">' +
          '<canvas class="icone" width="70" height="35"></canvas>' +
          '<div class="card-meta">' +
            '<h2>' + titulo + '</h2>' +
            '<span class="console">' + consoleTxt + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="card-corpo">' +
          '<p>' + desc + '</p>' +
          '<p class="teclas">' + teclas + '</p>' +
        '</div>' +
        '<div class="card-acoes">' +
          '<a class="jogar" href="' + recomendado + forcado + '">' + btnTexto + '</a>' +
          '<span class="outra">' + outraTexto + '</span>' +
        '</div>';

      pintarIcone(card.querySelector('canvas'), j.id);
      lista.appendChild(card);
    });
  }

  btnEn.addEventListener('click', function () {
    if (typeof window.definirIdioma === 'function') window.definirIdioma('en');
    renderizarMenu('en');
  });

  btnPt.addEventListener('click', function () {
    if (typeof window.definirIdioma === 'function') window.definirIdioma('pt');
    renderizarMenu('pt');
  });

  // Render inicial com o idioma ativo
  renderizarMenu(idiomaAtual);
})();
</script>
</body>
</html>
